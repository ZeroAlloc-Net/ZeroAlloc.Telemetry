name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore ZeroAlloc.Telemetry.slnx

      - name: Build
        run: dotnet build ZeroAlloc.Telemetry.slnx --configuration Release --no-restore -p:Version=${{ needs.release-please.outputs.version }}

      - name: Test
        run: dotnet test ZeroAlloc.Telemetry.slnx --configuration Release --no-build

      - name: Pack every src package
        run: |
          # Discovered, not listed. A hardcoded list silently omits any newly added
          # package: the release still goes green and the package never appears on
          # NuGet. Defaulting to pack means a new src project ships unless it opts
          # out, so the failure mode is a surplus package someone notices rather
          # than a missing one nobody does.
          for csproj in src/*/*.csproj; do
            if grep -q "<IsPackable>false</IsPackable>" "$csproj"; then
              echo "Skipping $csproj (IsPackable=false)"
              continue
            fi
            echo "Packing $csproj"
            dotnet pack "$csproj" --configuration Release --no-build --output ./artifacts -p:Version=${{ needs.release-please.outputs.version }}
          done
          if ! ls ./artifacts/*.nupkg >/dev/null 2>&1; then
            echo "::error::no packages were produced"
            exit 1
          fi

      - name: Push to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push to GitHub Packages
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/ZeroAlloc-Net/index.json --skip-duplicate

      - name: Upload packages to GitHub Release
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} ./artifacts/*.nupkg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
